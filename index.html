<!DOCTYPE html>
<html lang="en">
  <head>

      content="GET, POST, OPTIONS"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://lambent-haupia-726004.netlify.app/assets/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://lambent-haupia-726004.netlify.app/assets/css/animate.css"

      rel="stylesheet"
      href="https://lambent-haupia-726004.netlify.app/assets/css/all.min.css"

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />

      rel="stylesheet"
      href="https://lambent-haupia-726004.netlify.app/assets/css/common-css.css"

    <style>
      .login-sec {
        margin: 0;
        padding: 0;
        position: relative;
        display: flex;
        flex-wrap: wrap;
        height: 100vh;
        width: 100%;
        overflow: hidden;
      }

      /* .login-carousel {
        margin: 0;
        padding: 0;
        position: relative;
        min-height: 100vh;
        width: 50%;
      } */

      .login-carousel .slider.owl-carousel {
        min-height: 100vh;
      }

      .login-carousel .slider.owl-carousel .slide-item {
        min-height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
      }

      .login-carousel .slider.owl-carousel .slide-item img {
        position: relative;
        width: 100%;
        height: 100vh;
        object-fit: cover;
      }

      .login-sec .login-body {
        margin: 0;
        padding: 30px;
        position: relative;
        width: 50%;
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: auto;
        min-height: 100vh;
      }

      .login-header {
        margin: 0 0 66px 0;
        padding: 0;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 50px;
      }

      .login-header .login-logo {
        margin: 0;
        padding: 0;
        position: relative;
        max-width: 220px;
        width: 100%;
        height: 100%;
      }

      .login-header .login-logo a {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-header .sign-up {
        gap: 16px;
        margin: 0;
        padding: 0;
        font-size: 15px;
        color: #184997;
        font-weight: 500;
      }

      .login-header .sign-up .sign-up-btn {
        margin: 0;
        padding: 0 14px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        color: var(--primary-color);
        height: 36px;
        background: none;
        border-radius: 50px;
        cursor: pointer;
        border: 1px solid;
        gap: 0 4px;
        font-weight: 500;
      }

      .login-form-sec {
        margin: 0 0 72px 0;
        padding: 0;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-form-body {
        margin: 0;
        padding: 3rem !important;
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 22px 0;
        max-width: 800px;
        width: 100%;
        overflow: hidden;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.03),
          0px 0px 2px rgba(0, 0, 0, 0.06), 0px 2px 6px rgba(0, 0, 0, 0.12) !important;
        border-radius: 1rem;
      }

      .login-form-body.signup-form-body {
        max-width: 520px !important;
      }

      .login-form-body .login-form-header {
        position: relative;
      }

      .login-form-header .lm-header-title {
        margin: 0px 0 20px 0;
        padding: 0;
        position: relative;
        display: block;
        font-size: 30px;
        line-height: 22px;
        font-weight: 700;
        color: var(--primary-color);
        text-align: center;
      }

      .login-form-body .login-form-header .back-btn {
        position: absolute;
        left: -2px;
        font-size: 14px;
        font-weight: 500;
        gap: 0 2px;
        color: var(--primary-color);
        cursor: pointer !important;
        z-index: 99;
      }

      .login-form-header .lm-header-text {
        margin: 0;
        padding: 0;
        position: relative;
        display: block;
        font-family: var(--papa-m-font-family-secondary);
        font-size: 15px;
        line-height: 14px;
        color: #282a3a;
        text-align: center;
      }

      .login-form {
        margin: 0;
        padding: 0;
        position: relative;
        width: 100%;
        height: 100%;
      }

      .login-form form {
        margin: 0;
        padding: 0;
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 16px 0;
        border-radius: 12px;
        background: var(--papa-m-scroll-track-color);
      }

      .login-form form .form-group {
        margin: 0;
      }

      .login-form form .form-group .form-label {
        margin: 0 0 8px 0;
        padding: 0;
        position: relative;
        font-size: 14px;
        line-height: 11px;
        color: #5a5e7f;
        font-weight: 500;
      }

      .login-form form .form-group .form-control {
        margin: 0;
        padding: 0 10px;
        height: 44px;
        font-size: 14px;
        color: var(--gery);
        border: none;
        border-radius: 6px;
        background: #e1e2e8;
      }

      .login-form form .form-group .form-control::placeholder {
        color: #8d909b;
      }

      .login-form form .form-group .frogot-p-link {
        margin: 0;
        padding: 0;
        font-size: 15px;
        color: #343753;
        font-weight: 500;
      }

      .login-form form .form-group.send-verification-form {
        max-width: 220px;
        width: 100%;
        margin: 0 auto;
      }

      .login-form form .form-group.send-verification-form button {
        width: 100%;
      }

      .login-form form button {
        margin: 16px 0 0 0;
        padding: 0;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        color: #fff;
        height: 44px;
        background: var(--primary-color);
        border-radius: 50px;
        cursor: pointer;
        gap: 8px;
      }

      .login-footer {
        margin: auto 0 0 0;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 16px;
      }

      .login-footer .lf-copyright {
        margin: 0;
        padding: 0;
        position: relative;
        display: block;
        font-family: var(--papa-m-font-family-secondary);
        line-height: 13px;
        font-weight: 500;
        color: #5f6368;
        font-size: 14px;
      }

      .login-footer ul {
        margin: 0;
        padding: 0;
        position: relative;
        display: flex;
        align-items: center;
        gap: 0 20px;
      }

      .login-footer ul li a {
        margin: 0;
        padding: 0;
        position: relative;
        display: block;
        font-family: var(--papa-m-font-family-secondary);
        line-height: 13px;
        font-weight: 500;
        color: var(--primary-color);
        font-size: 14px;
        text-decoration: underline !important;
      }

      .login-footer ul li a:hover {
        text-decoration: underline !important;
      }
      /*-----------LOGIN PAGE-----------*/

      .login-sec {
        display: flex;
        min-height: 100vh;
      }
      /* Pure CSS Carousel - Keep original positioning */
      .login-carousel {
        flex: 1;
        position: relative;
        order: 1;
        min-width: 50%;
        background: #ffffff;
        overflow: hidden;
      }

      /* Login form - Keep original positioning */
      .login-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #ffffff;
        order: 2;
        min-width: 50%;
      }

      .slider {
        height: 100vh;
        position: relative;
        overflow: hidden;
      }

      .slide-container {
        display: flex;
        width: 200%;
        height: 100%;
        animation: carousel-slide 8s infinite;
      }

      .slide-item {
        width: 50%;
        height: 100vh;
        flex-shrink: 0;
      }

      .slide-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Carousel sliding animation */
      @keyframes carousel-slide {
        0% {
          transform: translateX(0);
        }
        45% {
          transform: translateX(0);
        }
        50% {
          transform: translateX(-50%);
        }
        95% {
          transform: translateX(-50%);
        }
        100% {
          transform: translateX(0);
        }
      }

      /* Azure B2C Specific Styles */
      #api {
        width: 100%;
      }

      /* B2C Main Heading */
      #api .heading {
        text-align: center;
        margin-bottom: 1rem;
      }

      #api .heading h1 {
        font-size: 2rem !important;
        font-weight: 700 !important;
        margin-bottom: 0.5rem !important;
        color: #333 !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif !important;
      }

      /* B2C Form Intro */
      #api .intro {
        text-align: center;
        margin-bottom: 2rem;
      }

      #api .intro h2 {
        font-size: 1rem !important;
        font-weight: 400 !important;
        color: #666 !important;
        margin: 0 !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif !important;
      }

      /* B2C Form Container */
      #api .localAccount {
        width: 100%;
      }

      /* 2-COLUMN FORM LAYOUT - NEW ADDITION */
      #api .entry {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }

      /* B2C Entry Items */
      #api .entry-item {
        margin-bottom: 1.5rem !important;
      }

      /* Make buttons, working div, and other non-field elements span full width */
      #api .buttons,
      #api .working,
      #api .divider,
      #api .create,
      #api .conditional-note {
        grid-column: 1 / -1;
      }

      /* Style for conditional requirement note */
      .conditional-note {
        margin-bottom: 1rem !important;
        padding: 10px !important;
        background: #f8f9fa !important;
        border-left: 4px solid #ffc107 !important;
        border-radius: 4px !important;
      }

      .conditional-note p {
        margin: 0 !important;
        font-size: 14px !important;
        color: #856404 !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif !important;
      }

      /* Responsive - single column on mobile */
      @media (max-width: 768px) {
        #api .entry {
          grid-template-columns: 1fr;
        }
      }

      /* B2C Labels */
      #api label {
        display: block !important;
        margin-bottom: 0.5rem !important;
        font-weight: 500 !important;
        color: #333 !important;
        font-size: 14px !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif !important;
      }

      /* Password Label Container */
      #api .password-label {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        margin-bottom: 0.5rem !important;
      }

      #api .password-label label {
        margin-bottom: 0 !important;
      }

      /* B2C Input Fields */
      #api input[type="email"],
      #api input[type="password"],
      #api input[type="text"],
      #api input[type="tel"],
      #api input[type="url"],
      #api #email,
      #api #phone,
      #api #firstname,
      #api #lastname,
      #api #password,
      #api #department,
      #api #website,
      #api #address,
      #api #country,
      #api #state,
      #api #city,
      #api #zipcode,
      #api #invoiceref,
      #api #purchaseorder,
      #api #vendorid {
        width: 100% !important;
        padding: 12px 15px !important;
        border: 1px solid #ddd !important;
        border-radius: 4px !important;
        font-size: 16px !important;
        box-sizing: border-box !important;
        background: white !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif !important;
      }

      #api input:focus {
        outline: none !important;
        border-color: #007bff !important;
        box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25) !important;
      }

      /* Error State Input */
      #api input.highlightError {
        border-color: #dc3545 !important;
        box-shadow: 0 0 0 2px rgba(220, 53, 69, 0.25) !important;
      }

      /* B2C Error Messages */
      #api .error.pageLevel {
        margin-bottom: 1rem !important;
        padding: 10px !important;
        background: #f8d7da !important;
        border: 1px solid #f5c6cb !important;
        border-radius: 4px !important;
        display: none !important;
      }

      #api .error.pageLevel p {
        color: #dc3545 !important;
        font-size: 14px !important;
        margin: 0 !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif !important;
      }

      #api .error.itemLevel {
        margin-bottom: 0.5rem !important;
      }

      #api .error.itemLevel p {
        color: #dc3545 !important;
        font-size: 12px !important;
        margin: 0 !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif !important;
      }

      /* B2C Buttons */
      #api .buttons {
        margin-top: 2rem !important;
      }

      #api button#next,
      #api .buttons button {
        width: 100% !important;
        padding: 12px !important;
        background: #007bff !important;
        color: white !important;
        border: none !important;
        border-radius: 4px !important;
        font-size: 16px !important;
        font-weight: 500 !important;
        cursor: pointer !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif !important;
      }

      #api button#next:hover,
      #api .buttons button:hover {
        background: #0056b3 !important;
      }

      /* B2C Divider */
      #api .divider {
        text-align: center !important;
        margin: 2rem 0 !important;
        position: relative !important;
      }

      #api .divider::before {
        content: "" !important;
        position: absolute !important;
        top: 50% !important;
        left: 0 !important;
        right: 0 !important;
        height: 1px !important;
        background: #eee !important;
        z-index: 1 !important;
      }

      #api .divider h2 {
        background: white !important;
        padding: 0 1rem !important;
        font-size: 14px !important;
        color: #666 !important;
        margin: 0 !important;
        display: inline-block !important;
        position: relative !important;
        z-index: 2 !important;
        font-weight: 400 !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif !important;
      }

      /* B2C Create Account */
      #api .create {
        text-align: center !important;
        margin-top: 1.5rem !important;
      }

      #api .create p {
        color: #666 !important;
        font-size: 14px !important;
        margin: 0 !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif !important;
      }

      /* B2C Links */
      #api a#forgotPassword,
      #api a#createAccount,
      #api .create a,
      #api .password-label a {
        color: #007bff !important;
        text-decoration: none !important;
        font-size: 14px !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif !important;
      }

      #api a#forgotPassword:hover,
      #api a#createAccount:hover,
      #api .create a:hover,
      #api .password-label a:hover {
        text-decoration: underline !important;
      }
    </style>

    <title>Consolidated Hospitality Supplies</title>
  </head>

  <body>
    <section class="login-sec">
      <div class="login-carousel">
        <div class="slider">
          <div class="slide-container">
            <div class="slide-item">
              <img
                src="https://lambent-haupia-726004.netlify.app/assets/images/login-slide-img.jpg"
                alt="Login Image 1"
              />
            </div>
            <div class="slide-item">
              <img
                src="https://lambent-haupia-726004.netlify.app/assets/images/chs-login-img-2.jpg"
                alt="Login Image 2"
              />
            </div>
          </div>
        </div>
      </div>
      <div class="login-body">
        <div class="login-header">
          <div class="login-logo">
            <a href="#"
              ><img
                src="https://lambent-haupia-726004.netlify.app/assets/images/chs-logo.svg"
                alt="Consolidated Hospitality Supplies"
            /></a>
          </div>
        </div>

        <div class="login-form-sec">
          <div class="login-form-body">
            <!-- Azure B2C will inject the sign-in form here -->
            <div id="api" data-name="Unified" role="main">
              <div class="heading">
                <h1 role="heading">Sign up</h1>
              </div>
              <form
                id="localAccountForm"
                class="localAccount"
                aria-label="Sign in with your email address"
              >
                <!-- <div class="intro">
                  <h2>Sign in with your email address</h2>
                </div> -->
                <div class="error pageLevel" aria-hidden="true" role="alert">
                  <p></p>
                </div>
                <div class="entry">
                  <div class="entry-item">
                    <label for="firstname"
                      >Firstname <span style="color: red">*</span></label
                    >
                    <div
                      class="error itemLevel"
                      aria-hidden="true"
                      role="alert"
                    >
                      <p></p>
                    </div>
                    <input
                      type="text"
                      id="firstname"
                      name="Firstname"
                      title="Please enter your first name"
                      placeholder="Firstname"
                      aria-label="Firstname"
                      required
                    />
                  </div>
                  <div class="entry-item">
                    <label for="lastname"
                      >Lastname <span style="color: red">*</span></label
                    >
                    <div
                      class="error itemLevel"
                      aria-hidden="true"
                      role="alert"
                    >
                      <p></p>
                    </div>
                    <input
                      type="text"
                      id="lastname"
                      name="Lastname"
                      title="Please enter your last name"
                      placeholder="Lastname"
                      aria-label="Lastname"
                      required
                    />
                  </div>
                  <div class="entry-item">
                    <label for="email"
                      >Email Address <span style="color: red">*</span></label
                    >
                    <div
                      class="error itemLevel"
                      aria-hidden="true"
                      role="alert"
                    >
                      <p></p>
                    </div>
                    <input
                      type="email"
                      id="email"
                      name="Email Address"
                      title="Please enter a valid email address"
                      pattern="^[a-zA-Z0-9!#$%&amp;'+^_`{}~-]+(?:\.[a-zA-Z0-9!#$%&amp;'+^_`{}~-]+)*@(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?\.)+[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?$"
                      autofocus=""
                      placeholder="Email Address"
                      aria-label="Email Address"
                      required
                    />
                  </div>
                  <div class="entry-item">
                    <label for="phone">Phone</label>
                    <div
                      class="error itemLevel"
                      aria-hidden="true"
                      role="alert"
                    >
                      <p></p>
                    </div>
                    <input
                      type="tel"
                      id="phone"
                      name="Phone"
                      title="Please enter a valid phone number"
                      placeholder="Phone"
                      aria-label="Phone"
                    />
                  </div>
                  <div class="entry-item">
                    <label for="department">Department</label>
                    <div
                      class="error itemLevel"
                      aria-hidden="true"
                      role="alert"
                    >
                      <p></p>
                    </div>
                    <input
                      type="text"
                      id="department"
                      name="Department"
                      title="Please enter your department"
                      placeholder="Department"
                      aria-label="Department"
                    />
                  </div>
                  <div class="entry-item">
                    <label for="website">Website</label>
                    <div
                      class="error itemLevel"
                      aria-hidden="true"
                      role="alert"
                    >
                      <p></p>
                    </div>
                    <input
                      type="url"
                      id="website"
                      name="Website"
                      title="Please enter your website (e.g., https://example.com)"
                      placeholder="https://example.com"
                      aria-label="Website"
                    />
                  </div>
                  <div class="entry-item">
                    <label for="address"
                      >Address <span style="color: red">*</span></label
                    >
                    <div
                      class="error itemLevel"
                      aria-hidden="true"
                      role="alert"
                    >
                      <p></p>
                    </div>
                    <input
                      type="text"
                      id="address"
                      name="Address"
                      title="Please enter your address"
                      placeholder="Address"
                      aria-label="Address"
                      required
                    />
                  </div>
                  <div class="entry-item">
                    <label for="country"
                      >Country <span style="color: red">*</span></label
                    >
                    <div
                      class="error itemLevel"
                      aria-hidden="true"
                      role="alert"
                    >
                      <p></p>
                    </div>
                    <input
                      type="text"
                      id="country"
                      name="Country"
                      title="Please enter your country"
                      placeholder="Country"
                      aria-label="Country"
                      required
                    />
                  </div>
                  <div class="entry-item">
                    <label for="state"
                      >State <span style="color: red">*</span></label
                    >
                    <div
                      class="error itemLevel"
                      aria-hidden="true"
                      role="alert"
                    >
                      <p></p>
                    </div>
                    <input
                      type="text"
                      id="state"
                      name="State"
                      title="Please enter your state"
                      placeholder="State"
                      aria-label="State"
                      required
                    />
                  </div>
                  <div class="entry-item">
                    <label for="city"
                      >City <span style="color: red">*</span></label
                    >
                    <div
                      class="error itemLevel"
                      aria-hidden="true"
                      role="alert"
                    >
                      <p></p>
                    </div>
                    <input
                      type="text"
                      id="city"
                      name="City"
                      title="Please enter your city"
                      placeholder="City"
                      aria-label="City"
                      required
                    />
                  </div>
                  <div class="entry-item">
                    <label for="zipcode"
                      >Zipcode <span style="color: red">*</span></label

    <!-- JavaScript for conditional validation -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("localAccountForm");
        const businessIdFields =
          document.querySelectorAll(".business-id-field");
        const submitButton = document.getElementById("next");

        // Function to validate business ID fields
        function validateBusinessIds() {
          const invoiceRef = document.getElementById("invoiceref").value.trim();
          const purchaseOrder = document
            .getElementById("purchaseorder")
            .value.trim();
          const vendorId = document.getElementById("vendorid").value.trim();

          return invoiceRef || purchaseOrder || vendorId;
        }

        // Function to show/hide business ID error
        function toggleBusinessIdError(show) {
          businessIdFields.forEach((field) => {
            const errorDiv =
              field.parentElement.querySelector(".error.itemLevel");
            const errorP = errorDiv.querySelector("p");

            if (show) {
              errorP.textContent = "At least one business ID field is required";
              errorDiv.style.display = "block";
              field.style.borderColor = "#dc3545";
            } else {
              errorP.textContent = "";
              errorDiv.style.display = "none";
              field.style.borderColor = "";
            }
          });
        }

        // Form submission handler
        form.addEventListener("submit", function (e) {
          if (!validateBusinessIds()) {
            e.preventDefault();
            toggleBusinessIdError(true);

            // Scroll to first business ID field
            document.getElementById("invoiceref").scrollIntoView({
              behavior: "smooth",
              block: "center",
            });

            return false;
          } else {
            toggleBusinessIdError(false);
          }
        });

        // Real-time validation for business ID fields
        businessIdFields.forEach((field) => {
          field.addEventListener("input", function () {
            if (validateBusinessIds()) {
              toggleBusinessIdError(false);
            }
          });
        });
      });
    </script>
